name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A failed run on main should not be masked by a newer push mid-review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Next.js app
        run: npm run build

      - name: Build PartyKit server
        # PartyKit has no `build` subcommand, so this bundles party/index.ts the
        # same way a deploy would. Catches a server-only break in CI rather than
        # at deploy time.
        run: npm run party:check
